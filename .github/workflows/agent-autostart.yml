name: Windows Agent autostart

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/agent-autostart.ps1'
      - '.github/workflows/agent-autostart.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('scripts/agent-autostart.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Check missing task status
        shell: pwsh
        run: ./scripts/agent-autostart.ps1 status
      - name: Verify non-interactive task definition and registration API
        shell: pwsh
        run: |
          $user = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          $principal = New-ScheduledTaskPrincipal -UserId $user -LogonType Password -RunLevel Limited
          $action = New-ScheduledTaskAction -Execute 'cmd.exe' -Argument '/c exit 0'
          $definition = New-ScheduledTask -Action $action -Principal $principal
          if ($definition.Principal.LogonType -ne 'Password') { throw 'Interactive principal' }
          $compatible = (Get-Command Register-ScheduledTask).ParameterSets | Where-Object {
            $names = $_.Parameters.Name
            ('InputObject' -in $names) -and ('User' -in $names) -and ('Password' -in $names)
          }
          if (-not $compatible) { throw 'Registration API does not support password-backed task definitions' }
