name: Unix Agent

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'internal/processutil/**'
      - 'internal/terminal/**'
      - 'internal/agent/**'
      - 'internal/session/**'
      - 'internal/protocol/**'
      - 'internal/server/**'
      - 'internal/storage/**'
      - 'cmd/codegate-agent/**'
      - 'cmd/codegate-server/**'
      - 'scripts/agent-autostart-linux.sh'
      - 'scripts/agent-autostart-macos.sh'
      - 'web/src/views/DevicesView.vue'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/unix-agent.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check boot scripts
        run: |
          sh -n scripts/agent-autostart-linux.sh
          sh -n scripts/agent-autostart-macos.sh
          if [ "$(uname -s)" = Darwin ]; then
            sh scripts/agent-autostart-macos.sh render > /tmp/codegate-agent.plist
            plutil -lint /tmp/codegate-agent.plist
          fi
      - name: Build Agent
        run: go build ./cmd/codegate-agent
      - name: Test PTY integration
        run: go test ./internal/terminal -run TestUnixPTY -count=1 -timeout 2m -v
      - name: Test Go packages
        run: go test ./... -timeout 5m
