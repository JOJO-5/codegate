name: DSH Web integration
on:
  pull_request:
    paths:
      - 'internal/agent/**'
      - 'internal/protocol/**'
      - 'go.mod'
      - 'go.sum'
      - 'internal/server/dsh_*'
      - '.github/workflows/dsh-web-integration.yml'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-dsh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install DeepSeek Harness
        run: npm install -g @deepseek-ai/dsh
      - name: Check real DSH token exchange
        env:
          CODEGATE_TEST_DSH: '1'
        run: go test ./internal/agent -run '^TestRealDSHBrowserTokenExchange$' -count=1 -timeout=2m
