name: Programming CLI control e2e

on:
  push:
    branches: [test/cli-control-e2e]

jobs:
  codex:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Codex CLI
        run: |
          npm install -g @openai/codex@0.157.1
          codex --version
      - name: Build Server and Agent
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          go build -o bin/codegate-server.exe ./cmd/codegate-server
          go build -o bin/codegate-agent.exe ./cmd/codegate-agent
      - name: E2E command and interactive Codex control
        shell: bash
        env:
          E2E_CLI_CONTROL: '1'
          PORT: '18849'
        run: bash scripts/e2e-terminal.sh
